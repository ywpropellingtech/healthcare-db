version: 2

models:
  - name: fct_encounters
    description: Fact table for patient encounters with dimensional keys
    columns:
      - name: encounter_key
        description: Surrogate key for encounters
        data_tests:
          - not_null
          - unique
      - name: encounter_id
        description: Source encounter identifier
        data_tests:
          - not_null
      - name: patient_id
        description: Patient identifier
        data_tests:
          - not_null
      - name: employee_key
        description: Provider employee key
      - name: employee_id
        description: Provider employee identifier
      - name: provider_npi
        description: Provider NPI
        data_tests:
          - not_null
      - name: encounter_date
        description: Encounter date
        data_tests:
          - not_null
      - name: encounter_type
        description: Type of encounter
        data_tests:
          - not_null
          - accepted_values:
              values: ['OFFICE', 'TELEHEALTH', 'ED', 'INPATIENT', 'OUTPATIENT', 'OTHER']
      - name: revenue_amount
        description: Revenue from encounter
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: charge_amount
        description: Total charges
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: dim_providers
    description: Provider/employee dimension table
    columns:
      - name: provider_key
        description: Unique provider identifier
        data_tests:
          - not_null
          - unique
      - name: provider_npi
        description: Provider National Provider Identifier
        data_tests:
          - not_null
          - unique
          - dbt_expectations.expect_column_values_to_match_regex:
              regex: '^\d{10}$'
      - name: provider_name
        description: Full provider name
        data_tests:
          - not_null
      - name: employment_status
        description: Provider employment status
        data_tests:
          - accepted_values:
              values: ['ACTIVE', 'INACTIVE', 'TERMINATED', 'UNKNOWN']
      - name: is_active_provider
        description: Whether provider is currently active
        data_tests:
          - not_null

  - name: dim_departments
    description: Department dimension table
    columns:
      - name: department_key
        description: Unique department identifier
        data_tests:
          - not_null
          - unique
      - name: department_id
        description: Source department identifier
        data_tests:
          - not_null
          - unique
      - name: department_name
        description: Department name
        data_tests:
          - not_null
      - name: department_type
        description: Department type classification
        data_tests:
          - accepted_values:
              values: ['Outpatient', 'Emergency', 'Inpatient', 'Other']

  - name: mart_provider_performance
    description: Daily provider performance KPIs
    columns:
      - name: provider_metric_key
        description: Unique provider metric identifier
        data_tests:
          - not_null
      - name: metric_date
        description: Date for metrics
        data_tests:
          - not_null
      - name: total_encounters
        description: Total encounters for provider
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_revenue
        description: Total revenue for provider
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: pct_encounters_with_revenue
        description: Percent of encounters with revenue
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100

  - name: mart_department_utilization
    description: Daily department utilization metrics
    columns:
      - name: dept_metric_key
        description: Unique department metric identifier
        data_tests:
          - not_null
      - name: metric_date
        description: Date for metrics
        data_tests:
          - not_null
      - name: department_id
        description: Department identifier
        data_tests:
          - not_null
      - name: total_encounters
        description: Total encounters in department
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: active_providers
        description: Count of active providers
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: mart_revenue_analysis
    description: Comprehensive revenue metrics by provider and department
    columns:
      - name: revenue_key
        description: Unique revenue metric identifier
        data_tests:
          - not_null
      - name: metric_date
        description: Date for metrics
        data_tests:
          - not_null
      - name: aggregation_level
        description: Level of aggregation (PROVIDER or DEPARTMENT)
        data_tests:
          - not_null
          - accepted_values:
              values: ['PROVIDER', 'DEPARTMENT']
      - name: total_revenue
        description: Total revenue
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: revenue_realization_pct
        description: Percentage of charges realized as revenue
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
