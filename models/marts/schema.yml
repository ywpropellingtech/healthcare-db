version: 2

models:
  - name: quality_checks_encounters
    description: Data quality validation checks for stg_encounters model - validates standardization, transformations, and readiness for mart layer
    columns:
      - name: check_name
        description: Name of the quality check performed
      - name: issue_count
        description: Number of issues found by this check (0 means pass)
      - name: expected
        description: Expected result or summary statistic from the check

  - name: quality_checks_employees
    description: Data quality validation checks for stg_employees model - validates dimension table readiness
    columns:
      - name: check_name
        description: Name of the quality check performed
      - name: issue_count
        description: Number of issues found by this check (0 means pass)
      - name: expected
        description: Expected result or summary statistic from the check

  - name: mart_encounter_volume_trend
    description: |
      Analytics-ready mart table for encounter volume trend visualization and analysis.

      Purpose:
      - Primary data source for "Encounter volume trend" analytics metric
      - Enables stacked bar chart visualization (visits per month, colored by visit type)
      - Provides trend analysis, forecasting, and capacity planning insights
      - Tracks operational demand patterns and seasonal variations

      Key Features:
      - Filtered to COMPLETED encounters only (legitimate operational activity)
      - Aggregated by month and visit type
      - Includes wRVU productivity metrics per visit type
      - Calculates percentage of visits by type within each month
      - Includes cumulative visits for trend analysis
      - Ranked by volume within month for easy top-N filtering

      Data Lineage:
      stg_encounters → int_encounter_volume_by_month_visit_type → mart_encounter_volume_trend

    columns:
      - name: encounter_month
        description: First day of the month (YYYY-MM-01 format)
        data_type: date
        tests:
          - not_null

      - name: visit_type
        description: Type of visit (FOLLOW-UP, NEW PATIENT, PROCEDURE, TELEHEALTH)
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FOLLOW-UP', 'NEW PATIENT', 'PROCEDURE', 'TELEHEALTH']

      - name: completed_visits
        description: Count of COMPLETED encounters for this month/visit_type combination
        data_type: number
        tests:
          - not_null

      - name: total_wrvu
        description: Sum of wRVU for all completed visits in this group
        data_type: float
        tests:
          - not_null

      - name: avg_wrvu_per_encounter
        description: Average wRVU per completed encounter in this group
        data_type: float
        tests:
          - not_null

      - name: pct_of_month_visits
        description: Percentage of this visit type's completed visits out of total visits that month
        data_type: float
        tests:
          - not_null

      - name: cumulative_visits_by_type
        description: Running total of completed visits for this visit type across months (year-to-date)
        data_type: number
        tests:
          - not_null

      - name: rank_in_month
        description: Ranking of visit type by volume within the month (1=most common, 4=least common)
        data_type: number
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]

  - name: mart_cost_per_wrvu
    description: |
      Analytics-ready mart table for cost per wRVU analysis and compensation benchmarking.

      Purpose:
      - Primary data source for "Cost per work RVU" analytics metric
      - Enables employee efficiency benchmarking vs. service line average
      - Supports compensation analysis and performance evaluation
      - Provides scatter plots (salary vs. wRVU) and efficiency rankings

      Key Features:
      - Links employees to their encounters and productivity metrics
      - Calculates cost per wRVU (salary ÷ wRVU production)
      - Includes service line benchmarks (average, median, quartiles)
      - Provides quartile rankings for easy filtering/segmentation
      - Calculates variance from median for outlier detection
      - Ranks employees by cost efficiency and productivity

      Key Metrics:
      - cost_per_wrvu: Lower = more cost-efficient (less salary per unit work)
      - wrvu_per_fte: Higher = more productive (more work per FTE)
      - efficiency_ratio: <1.0 = above average, >1.0 = below average
      - pct_variance_from_median: Shows % difference from service line median

      Data Lineage:
      stg_employees + stg_encounters → int_cost_per_wrvu_by_employee → mart_cost_per_wrvu

    columns:
      - name: employee_key
        description: Unique employee identifier
        data_type: varchar
        tests:
          - not_null
          - unique

      - name: full_name
        description: Employee full name
        data_type: varchar
        tests:
          - not_null

      - name: service_line
        description: Department or service line
        data_type: varchar
        tests:
          - not_null

      - name: annual_salary
        description: Annual salary in dollars
        data_type: number
        tests:
          - not_null

      - name: fte
        description: Full-time equivalent (1.0 = full-time, 0.8 = part-time, etc.)
        data_type: float
        tests:
          - not_null

      - name: completed_encounters
        description: Count of completed encounters attributed to employee
        data_type: number
        tests:
          - not_null

      - name: total_wrvu
        description: Total wRVU generated by employee
        data_type: float
        tests:
          - not_null

      - name: wrvu_per_fte
        description: wRVU production standardized to full-time equivalent (higher is better)
        data_type: float
        tests:
          - not_null

      - name: cost_per_wrvu
        description: Cost efficiency metric (annual salary ÷ total wRVU) - lower is better
        data_type: float
        tests:
          - not_null

      - name: service_line_avg_cost_per_wrvu
        description: Average cost per wRVU for all employees in service line
        data_type: float
        tests:
          - not_null

      - name: service_line_median_cost_per_wrvu
        description: Median cost per wRVU for all employees in service line
        data_type: float
        tests:
          - not_null

      - name: service_line_avg_wrvu_per_fte
        description: Average wRVU per FTE for service line
        data_type: float
        tests:
          - not_null

      - name: service_line_employee_count
        description: Number of employees in service line with encounter data
        data_type: number
        tests:
          - not_null

      - name: efficiency_ratio
        description: Employee cost per wRVU ÷ service line average (1.0 = at average)
        data_type: float
        tests:
          - not_null

      - name: efficiency_category
        description: Above/Below/At Average efficiency vs. service line median
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Above Average', 'Below Average', 'At Average']

      - name: cost_per_wrvu_quartile
        description: Quartile ranking by cost per wRVU within service line (1=most efficient, 4=least)
        data_type: number
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]

      - name: wrvu_per_fte_quartile
        description: Quartile ranking by productivity within service line (1=least productive, 4=most)
        data_type: number
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]

      - name: cost_efficiency_rank
        description: Ranking of employee by cost per wRVU within service line (1=most efficient)
        data_type: number
        tests:
          - not_null

      - name: productivity_rank
        description: Ranking of employee by wRVU per FTE within service line (1=most productive)
        data_type: number
        tests:
          - not_null

      - name: pct_variance_from_median
        description: Percentage difference from service line median cost per wRVU (negative=better)
        data_type: float
        tests:
          - not_null
