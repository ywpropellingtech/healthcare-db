version: 2

models:
  - name: int_encounter_volume_by_month_visit_type
    description: |
      Intermediate table aggregating encounter volume by month and visit type.

      Purpose:
      - Support "Encounter volume trend" analytics metric
      - Enable stacked bar chart visualization (visits per month, colored by visit type)
      - Track operational demand patterns over time
      - Identify seasonal trends and capacity planning needs

      Key Features:
      - Aggregates encounters by calendar month
      - Groups by visit type (FOLLOW-UP, NEW PATIENT, PROCEDURE, TELEHEALTH)
      - Includes status dimension (COMPLETED, CANCELLED, NO-SHOW) for filtering
      - Calculates wRVU statistics per visit type per month
      - Includes cumulative count for trend analysis

    columns:
      - name: encounter_month
        description: First day of the month (YYYY-MM-01 format)
        data_type: date
        tests:
          - not_null

      - name: visit_type
        description: Type of visit (FOLLOW-UP, NEW PATIENT, PROCEDURE, TELEHEALTH)
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FOLLOW-UP', 'NEW PATIENT', 'PROCEDURE', 'TELEHEALTH']

      - name: encounter_status
        description: Status of encounter (COMPLETED, CANCELLED, NO-SHOW)
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['COMPLETED', 'CANCELLED', 'NO-SHOW']

      - name: encounter_count
        description: Number of encounters for this month/visit_type/status combination
        data_type: number
        tests:
          - not_null
          - dbt_utils.not_constant

      - name: total_wrvu
        description: Sum of wRVU for encounters in this group
        data_type: float
        tests:
          - not_null

      - name: avg_wrvu_per_encounter
        description: Average wRVU per encounter in this group
        data_type: float
        tests:
          - not_null

      - name: cumulative_completed_count
        description: Running total of COMPLETED encounters for this visit type across months
        data_type: number
        tests:
          - not_null

  - name: int_cost_per_wrvu_by_employee
    description: |
      Intermediate table for cost efficiency analysis by employee and service line.

      Purpose:
      - Support "Cost per work RVU" analytics metric
      - Benchmark employee productivity costs against service line average
      - Identify high/low efficiency providers
      - Support compensation analysis and performance evaluation

      Key Features:
      - Links employees to encounters via provider NPI matching
      - Calculates total annual wRVU production per employee
      - Computes cost per wRVU (annual salary ÷ total wRVU)
      - Includes service line benchmarks (average, median, count)
      - Calculates efficiency ratio vs. service line average
      - Categorizes as Above/Below/At Average efficiency

      Data Lineage:
      stg_employees + stg_encounters → int_cost_per_wrvu_by_employee

    columns:
      - name: employee_key
        description: Unique employee identifier (matches stg_employees)
        data_type: varchar
        tests:
          - not_null
          - unique

      - name: full_name
        description: Employee full name
        data_type: varchar
        tests:
          - not_null

      - name: service_line
        description: Department/service line (from employee record)
        data_type: varchar
        tests:
          - not_null

      - name: annual_salary
        description: Employee annual salary in dollars
        data_type: number
        tests:
          - not_null

      - name: fte
        description: Full-time equivalent status (0.5-1.0 for part-time, 1.0+ for full-time)
        data_type: float
        tests:
          - not_null

      - name: completed_encounters
        description: Count of COMPLETED encounters attributed to this employee
        data_type: number
        tests:
          - not_null

      - name: total_wrvu
        description: Total wRVU generated by this employee from their encounters
        data_type: float
        tests:
          - not_null

      - name: wrvu_per_fte
        description: wRVU production standardized to full-time equivalent
        data_type: float
        tests:
          - not_null

      - name: cost_per_wrvu
        description: Cost efficiency metric (annual salary ÷ total wRVU) - lower is better
        data_type: float
        tests:
          - not_null

      - name: service_line_avg_cost_per_wrvu
        description: Average cost per wRVU for all employees in this service line
        data_type: float
        tests:
          - not_null

      - name: service_line_median_cost_per_wrvu
        description: Median cost per wRVU for all employees in this service line
        data_type: float
        tests:
          - not_null

      - name: service_line_avg_wrvu_per_fte
        description: Average wRVU production per FTE for employees in this service line
        data_type: float
        tests:
          - not_null

      - name: service_line_employee_count
        description: Number of employees in this service line with encounter data
        data_type: number
        tests:
          - not_null

      - name: efficiency_ratio
        description: Employee cost per wRVU divided by service line average (1.0 = at average, <1.0 = above average)
        data_type: float
        tests:
          - not_null

      - name: efficiency_category
        description: Categorization of employee efficiency vs. service line median
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Above Average', 'Below Average', 'At Average']
