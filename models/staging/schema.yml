version: 2

models:
  - name: stg_employees
    description: Cleaned and standardized employee data from Workday
    columns:
      - name: employee_key
        description: Surrogate key for employee records
        data_tests:
          - unique
          - not_null
      - name: employee_id
        description: Unique employee identifier from source
        data_tests:
          - not_null
      - name: full_name
        description: Full name (trimmed)
        data_tests:
          - not_null
      - name: npi
        description: National Provider Identifier
      - name: job_title
        description: Job title or position (trimmed)
      - name: worker_type
        description: Employee or Contingent Worker classification
      - name: department
        description: Department name (trimmed)
      - name: cost_center
        description: Cost center (trimmed)
      - name: fte
        description: Full-Time Equivalent
      - name: annual_salary
        description: Annual salary
      - name: hire_date
        description: Employee hire date
        data_tests:
          - not_null
      - name: termination_date
        description: Employee termination date (null if active)
      - name: location
        description: Employee location
      - name: last_updated
        description: Timestamp of last update from source system
      - name: dbt_loaded_at
        description: Timestamp when record was loaded by dbt

  - name: stg_encounters
    description: Cleaned and standardized encounter data from Epic
    columns:
      - name: encounter_key
        description: Surrogate key for encounter records
        data_tests:
          - not_null
      - name: encounter_id
        description: Unique encounter identifier
        data_tests:
          - not_null
      - name: patient_id
        description: Patient identifier (MRN)
        data_tests:
          - not_null
      - name: provider_name
        description: Provider name (trimmed)
      - name: provider_npi
        description: Provider NPI
      - name: encounter_date
        description: Encounter date
        data_tests:
          - not_null
      - name: department
        description: Department name (trimmed)
      - name: visit_type
        description: Type of visit
      - name: encounter_status
        description: Encounter completion status
      - name: wrvu
        description: Work RVU
      - name: charge_amount
        description: Total charge amount
      - name: dbt_loaded_at
        description: Timestamp when record was loaded by dbt
