version: 2

sources:
  - name: raw_workday
    database: RAW
    schema: WORKDAY
    description: Workday HR system source data
    tables:
      - name: WRK_EMPLOYEES
        description: Employee master data from Workday
        columns:
          - name: EMPLOYEE_ID
            description: Unique employee identifier
            data_tests:
              - not_null
          - name: FULL_NAME
            description: Employee full name
          - name: NPI
            description: National Provider Identifier
          - name: JOB_TITLE
            description: Job title or position
          - name: WORKER_TYPE
            description: Employee or Contingent Worker
          - name: DEPARTMENT
            description: Department name
          - name: COST_CENTER
            description: Cost center code
          - name: FTE
            description: Full-Time Equivalent
          - name: ANNUAL_SALARY
            description: Annual salary
          - name: HIRE_DATE
            description: Employment hire date
          - name: TERMINATION_DATE
            description: Employment termination date (null if active)
          - name: LOCATION
            description: Employee location
          - name: LAST_UPDATED
            description: Last updated timestamp

  - name: raw_epic
    database: RAW
    schema: EPIC
    description: Epic EHR system source data
    tables:
      - name: EPC_ENCOUNTERS
        description: Patient encounter records from Epic
        columns:
          - name: ENCOUNTER_ID
            description: Unique encounter identifier
            data_tests:
              - not_null
          - name: PATIENT_MRN
            description: Patient Medical Record Number
            data_tests:
              - not_null
          - name: PROVIDER_NAME
            description: Provider name from encounter
          - name: PROVIDER_NPI
            description: Provider NPI from encounter
          - name: ENCOUNTER_DATE
            description: Date of encounter
            data_tests:
              - not_null
          - name: DEPARTMENT
            description: Department where encounter occurred
          - name: VISIT_TYPE
            description: Type of visit (OFFICE, TELEHEALTH, ED, INPATIENT, PROCEDURE)
          - name: ENCOUNTER_STATUS
            description: Encounter completion status
          - name: WRVU
            description: Work RVU (wRVU)
          - name: CHARGE_AMOUNT
            description: Total charge amount
