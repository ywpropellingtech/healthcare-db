
# Project name: used to build derived schema names
name: 'healthcare_analytics'
version: '1.0.0'
config-version: 2

# Project database connection profile
profile: 'healthcare_analytics'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
data-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:
  healthcare_analytics:
    # Staging layer - raw data cleaning and transformations
    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging']

    # Intermediate layer - business logic and aggregations
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ['intermediate']

    # Marts layer - final dimensional and fact tables
    marts:
      +materialized: table
      +schema: marts
      +tags: ['marts']

# Seed configurations
seeds:
  +schema: seeds
  +tags: ['seeds']

vars:
  # Global variables for data quality checks
  start_date: '2020-01-01'
  end_date: '2026-12-31'
  null_threshold: 0.1  # Alert if > 10% nulls in key columns
